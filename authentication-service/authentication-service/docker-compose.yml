services:
  postgres:
    image: postgres:16-alpine
    container_name: codeforge-auth-postgres
    environment:
      POSTGRES_DB: codeforge_auth
      POSTGRES_USER: codeforge
      POSTGRES_PASSWORD: codeforge
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codeforge -d codeforge_auth"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: codeforge-auth-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:3.7.1
    container_name: codeforge-auth-kafka
    ports:
      - "9092:9092"
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 12

  authentication-service:
    build:
      context: .
      dockerfile: Dockerfile
    image: codeforge/authentication-service:local
    pull_policy: build
    container_name: codeforge-authentication-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      AUTH_DATASOURCE_URL: jdbc:postgresql://postgres:5432/codeforge_auth
      AUTH_DATASOURCE_USERNAME: codeforge
      AUTH_DATASOURCE_PASSWORD: codeforge
      AUTH_REDIS_HOST: redis
      AUTH_REDIS_PORT: 6379
      AUTH_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      AUTH_JWT_SECRET: codeforge-authentication-service-docker-local-secret-change-before-production
      AUTH_JPA_DDL_AUTO: update
    ports:
      - "${AUTH_SERVICE_HOST_PORT:-8082}:8081"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  kafka-data:
