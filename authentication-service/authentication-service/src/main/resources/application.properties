spring.application.name=authentication-service

server.port=8081

spring.datasource.url=${AUTH_DATASOURCE_URL:jdbc:h2:mem:codeforge_auth;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${AUTH_DATASOURCE_USERNAME:sa}
spring.datasource.password=${AUTH_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=${AUTH_DATASOURCE_DRIVER:org.h2.Driver}

spring.jpa.hibernate.ddl-auto=${AUTH_JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.database-platform=${AUTH_HIBERNATE_DIALECT:org.hibernate.dialect.H2Dialect}

spring.data.redis.host=${AUTH_REDIS_HOST:localhost}
spring.data.redis.port=${AUTH_REDIS_PORT:6379}

spring.kafka.bootstrap-servers=${AUTH_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

auth.issuer=${AUTH_ISSUER:codeforge-authentication-service}
auth.jwt.secret=${AUTH_JWT_SECRET:codeforge-authentication-service-change-me-codeforge-authentication-service-change-me}
auth.jwt.access-token-ttl=PT15M
auth.jwt.refresh-token-ttl=P30D
auth.security.login-attempt-limit=5
auth.security.account-lock-duration=PT15M
auth.security.validate-ip=true
auth.security.validate-device=true
auth.security.refresh-token-rotation=true
auth.otp.ttl=PT10M
auth.otp.max-attempts=5
auth.oauth2.redirect-uri=${AUTH_OAUTH2_REDIRECT_URI:http://localhost:3000/auth/oauth2/callback}
