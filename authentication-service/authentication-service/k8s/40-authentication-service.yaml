apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentication-service
  namespace: codeforge
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentication-service
  template:
    metadata:
      labels:
        app: authentication-service
    spec:
      containers:
        - name: authentication-service
          image: codeforge/authentication-service:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: auth-service-secret
          readinessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 8081
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: authentication-service
  namespace: codeforge
spec:
  type: NodePort
  selector:
    app: authentication-service
  ports:
    - name: http
      port: 8081
      targetPort: 8081
      nodePort: 30081
